[package]
name = "tunex-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Core interfaces, traits, configs, and orchestration primitives for TuneX modular LLM fine-tuning runtime"
license = "MIT OR Apache-2.0"
repository = "https://github.com/shregar1/core.tunex.vexarr.com"
homepage = "https://core.tunex.vexarr.com"
documentation = "https://docs.rs/tunex-core"
readme = "README.md"
keywords = ["llm", "finetuning", "rust", "training", "ai"]
categories = ["science", "development-tools"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "tunex_core"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1.89"
bytemuck = "1.25.0"
bytes = { version = "1", features = ["serde"] }
chrono = "0.4.44"
metrics = "0.24.6"
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive", "rc"], optional = true }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
smallvec = { version = "1", features = ["serde"] }
thiserror = "2.0.18"
toml = "=1.0.7"
tracing = "0.1.44"
uuid = "=1.20.0"

[dev-dependencies]
criterion = "0.7.0"
proptest = "=1.8.0"
rstest = "0.26.1"

[features]
default = ["std", "alloc", "serde"]
std = ["alloc"]
alloc = []
serde = ["dep:serde"]
tokio = []
rayon = []
distributed = []
metrics = []
wasm = []
cuda = []
metal = []
rocm = []

[[bench]]
name = "contract_overhead"
harness = false
