allow-branch = ["main"]
consolidate-commits = true
dependent-version = "upgrade"
dev-version = false
enable-all-features = true
pre-release-commit-message = "chore: release {{version}}"
publish = false
push = true
sign-commit = false
sign-tag = false
tag-message = "Release {{crate_name}} {{version}}"
tag-name = "v{{version}}"
verify = true

pre-release-replacements = [
  { file = "VERSION", search = "^[0-9]+\\.[0-9]+\\.[0-9]+$", replace = "{{version}}", exactly = 1 },
  { file = "CHANGELOG.md", search = "## Unreleased", replace = "## Unreleased\n\n## {{version}}", exactly = 1 },
]
