name: Benchmarks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dunsafe_code"

jobs:
  benchmark-smoke:
    name: Criterion smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build benchmarks
        run: cargo bench --no-run --locked

      - name: Run criterion smoke benchmark
        run: cargo bench --bench contract_overhead --locked -- --sample-size 10 --measurement-time 1 --warm-up-time 1
